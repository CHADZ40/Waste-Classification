[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "waste-classifier"
version = "0.1.0"
description = "Four-class waste classifier tested on studio and real-world images."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "pandas",
    "pillow",
    "pyyaml",
    "scikit-learn",
    "timm",
    "torch",
    "torchvision",
    "tqdm",
]

[project.optional-dependencies]
app = ["certifi", "gradio", "mediapipe"]
dev = ["jupyter", "pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
